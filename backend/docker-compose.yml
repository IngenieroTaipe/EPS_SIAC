services:
  db_postgis:
    image: postgis/postgis:18-3.6
    container_name: eps_selva_central_db_postgis
    volumes:
      - eps_selva_central_data_db:/var/lib/postgresql
    networks:
      - eps_selva_central_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d eps_selva_central" ]
      interval: 5s
      timeout: 5s
      retries: 5

