services:
  # =========== DATABASE =========== 
  db_postgis:
    # Indicamos la ruta del .env de desarrollo
    env_file:
      - ./backend/.env.dev
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-eps_siac}
    ports:
      - "5435:5432"

  # =========== API (DJANGO) =========== 
  api:
    build:
      context: ./backend
      target: dev
    ports:
      - "8001:8000"
    volumes:
      - ./backend/:/app
    env_file:
      - ./backend/.env.dev
  
  # =========== FRONTEND (REACT) =========== 
  frontend:
    build:
      context: ./frontend2
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend2/:/app
      - /app/node_modules
    environment:
      # Utilizamos la variable declarada en el env_file del frontend
      - SITE_ADDRESS
    env_file:
      - ./frontend/.env.dev